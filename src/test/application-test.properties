# ??????????????????????????????????????????????????????????????
#  src/test/resources/application-test.properties
# ??????????????????????????????????????????????????????????????

# ?? Force H2 à la place de PostgreSQL ????????????????????????
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ?? Désactive l'autoconfigure PostgreSQL ??????????????????????
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ?? JWT ???????????????????????????????????????????????????????
app.jwt.secret=test-secret-key-minimum-256-bits-for-hmac-sha-algorithm-test
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# ?? App ???????????????????????????????????????????????????????
app.frontend-url=http://localhost:4200
server.port=8081

# ?? Swagger ???????????????????????????????????????????????????
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ?? Désactive open-in-view (supprime le WARN) ?????????????????
spring.jpa.open-in-view=false


# Mail ? valeurs factices pour satisfaire les @Value
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword